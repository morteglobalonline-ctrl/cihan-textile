name: Deploy to GitHub Pages

# Runs on every push to main, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# What the deploy needs: read the code, publish Pages, prove who it is.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reports the URL the site will live at. For a project repo that is
      # /<repo-name>; for a <user>.github.io repo, or once a custom domain is
      # attached, it is empty. next.config.ts reads it as PAGES_BASE_PATH.
      - name: Work out the Pages base path
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Switches Pages on and points it at Actions if it is not set up yet.
          # Without this the first run fails with "Get Pages site failed", since
          # the action only reads the config and will not create it.
          enablement: true

      - run: npm ci

      - run: npm run lint

      - name: Build the static site
        run: npm run build:static
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
